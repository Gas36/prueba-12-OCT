<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" role="img" aria-label="Teclado de piano iluminado (imagen placeholder del hero)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1b28"/>
      <stop offset="0.5" stop-color="#2a2c44"/>
      <stop offset="1" stop-color="#141520"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="55%">
      <stop offset="0" stop-color="#E07A5F" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#E07A5F" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#E07A5F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7e3d4"/>
      <stop offset="1" stop-color="#b0ab99"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="960" fill="url(#bg)"/>
  <rect width="1280" height="960" fill="url(#glow)"/>

  <!-- Teclado (grupo levemente inclinado para dar movimiento) -->
  <g transform="rotate(-4 640 520)">
    <!-- Teclas blancas -->
    <g fill="url(#key)" stroke="#b9b4a0" stroke-width="1.5">
      <rect x="300" y="380" width="70" height="300" rx="6"/>
      <rect x="370" y="380" width="70" height="300" rx="6"/>
      <rect x="440" y="380" width="70" height="300" rx="6"/>
      <rect x="510" y="380" width="70" height="300" rx="6"/>
      <rect x="580" y="380" width="70" height="300" rx="6"/>
      <rect x="650" y="380" width="70" height="300" rx="6"/>
      <rect x="720" y="380" width="70" height="300" rx="6"/>
      <rect x="790" y="380" width="70" height="300" rx="6"/>
      <rect x="860" y="380" width="70" height="300" rx="6"/>
      <rect x="930" y="380" width="70" height="300" rx="6"/>
    </g>
    <!-- Teclas negras -->
    <g fill="#1b1c28">
      <rect x="348" y="380" width="44" height="190" rx="4"/>
      <rect x="418" y="380" width="44" height="190" rx="4"/>
      <rect x="558" y="380" width="44" height="190" rx="4"/>
      <rect x="628" y="380" width="44" height="190" rx="4"/>
      <rect x="698" y="380" width="44" height="190" rx="4"/>
      <rect x="838" y="380" width="44" height="190" rx="4"/>
      <rect x="908" y="380" width="44" height="190" rx="4"/>
    </g>
  </g>

  <!-- Notas suaves -->
  <g fill="#F3F0DD" opacity="0.5">
    <g transform="translate(240,180)">
      <ellipse cx="0" cy="46" rx="15" ry="11" transform="rotate(-20 0 46)"/>
      <rect x="12" y="-6" width="6" height="52" rx="3"/>
    </g>
    <g transform="translate(1000,150)" opacity="0.8">
      <ellipse cx="0" cy="40" rx="12" ry="9" transform="rotate(-20 0 40)"/>
      <rect x="9" y="-2" width="5" height="42" rx="2.5"/>
    </g>
  </g>

  <text x="640" y="900" text-anchor="middle" font-family="Jost, sans-serif" font-size="24" fill="#F3F0DD" opacity="0.45">SolBemol · imagen del hero (placeholder)</text>
</svg>
